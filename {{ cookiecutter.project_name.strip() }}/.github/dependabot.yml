version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/api/go"
    # Check for updates to dependencies once a week - Saturday
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7

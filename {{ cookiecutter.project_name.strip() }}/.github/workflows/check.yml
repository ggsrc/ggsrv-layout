{%- raw %}
name: Go Build Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GO_VERSION: "{%- endraw %}{{ cookiecutter.go_version }}{%- raw %}"
  GOPRIVATE: ${{ vars.GOPRIVATE }}
  GITHUB_ACCESS_TOKEN: ${{ secrets.CICD_DOCKER_BUILD_PAT2 }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git for private repos
        if: env.GITHUB_ACCESS_TOKEN != ''
        run: git config --global "url.https://${GITHUB_ACCESS_TOKEN}@github.com/.insteadOf" https://github.com/

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up buf
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
          version: "1.75.0" # keep in step with BUF_VERSION in scripts/install-buf-deps.sh

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Test
        run: make test-coverage

      - name: Generate coverage report
        run: go tool cover -html=coverage.txt -o coverage.html

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.txt
            coverage.html
{%- endraw %}

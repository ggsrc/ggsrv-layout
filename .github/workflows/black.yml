name: Run Cookiecutter
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "ggsrv-layout"
          persist-credentials: false

      - name: Run Cookiecutter
        uses: andrewthetechie/gha-cookiecutter@dfb7bad11b752ad2858840dee02db8d55a19cb2a # v1.3.2
        with:
          # can be a link to a git repo or a local path
          template: ggsrv-layout
          cookiecutterValues: '{
            "project_name": "ggsrv_empty",
            "go_module_path": "github.com/ggsrc/ggsrv-empty",
            "org": "ggsrc",
            "base_branch": "main",
            "contact_email": "",
            "project_description": "GgsrvEmpty is a Go application created using https://github.com/ggsrc/ggsrv-layout",
            "use_precommit": "y",
            "go_version": "1.27.3"
         }'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ggsrv_empty
          path: ggsrv_empty
          include-hidden-files: true
          retention-days: 3


  test1:
    runs-on: ubuntu-latest
    needs: [build]

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ggsrv_empty
          path: ggsrv_empty

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: ggsrv_empty/go.sum

      - name: install sqlc
        env:
          SQLC_VERSION: v2.4.0
        run: |
          git clone --depth 1 --branch "$SQLC_VERSION" https://github.com/Stumble/sqlc.git /tmp/sqlc
          cd /tmp/sqlc
          go install ./cmd/sqlc

      - name: install proto toolchain (buf, protoc, plugins)
        working-directory: ggsrv_empty
        run: |
          bash scripts/install-buf-deps.sh

      - name: build proto
        working-directory: ggsrv_empty
        run: |
          make proto

      - name: generate repos
        working-directory: ggsrv_empty
        run: |
          make repos

      - name: go build
        working-directory: ggsrv_empty
        run: |
          make build

      - name: go test
        working-directory: ggsrv_empty
        run: |
          make test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get current date
        id: date
        run: echo "date=$(date +'%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push image to GCP Artifact Repository
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # add platform will be veryslow
          # platforms: linux/amd64
          context: ggsrv_empty
          file: ggsrv_empty/docker/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.date.outputs.date }}
          pull: false
          push: false

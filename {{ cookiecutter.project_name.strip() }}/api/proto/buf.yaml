version: v2
# Buf v2 only needs version: v2, no modules: required, just place buf.yaml in the proto root directory.
lint:
  use:
    - STANDARD
    - COMMENTS
  except:
    - PACKAGE_VERSION_SUFFIX
  rpc_allow_google_protobuf_empty_requests: true
  rpc_allow_google_protobuf_empty_responses: true
breaking:
  use:
    - WIRE_JSON
    - WIRE
    - FILE

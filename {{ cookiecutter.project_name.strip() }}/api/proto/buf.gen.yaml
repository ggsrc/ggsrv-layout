version: v2
plugins:
  # go get google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
  - local: protoc-gen-go
    out: ../go
    opt: paths=source_relative

  # go get google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.73.0
  # NOTE: its version is different from the following one.
  - local: protoc-gen-go-grpc
    out: ../go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

# Version of golangci-lint configuration file
# The only possible value is "2".
version: "2"

# Options for analysis running.
run:
  timeout: 10m # Set timeout duration
  # Which dirs to skip: issues from them won't be reported.
  # Can use regexp here: `generated.*`, regexp is applied on full path.
  # Default value is empty list,
  # but default dirs are skipped independently of this option's value (see skip-dirs-use-default).
  # "/" will be replaced by current OS file path separator to properly work on Windows.
  go: '{{ cookiecutter.go_version }}'

linters:
  enable: # Enable the following linters
    - asciicheck
    - bodyclose
    - dogsled
    - copyloopvar
    - goconst
    - gosec
    - unconvert
    - misspell
    - reassign # Check if package-level identifiers (usually variables) in standard library are reassigned
    - mirror # Detect mirror assignment situations like x = x, which are usually meaningless
    - durationcheck # Check if time.Duration values are incorrectly used as regular integers
    - whitespace # Check for improper whitespace usage in code
    - usetesting # Check if testing package functionality is used correctly in test files
    - bidichk # Check for Unicode BiDi control characters in Go source code that may cause security issues
    - prealloc # Check if slice or map capacity can be pre-allocated to avoid unnecessary memory reallocation during append operations
    # The following are linters integrated by default in golangci-lint
    # - unused
    # - errcheck
    # - govet
    # - ineffassign
    # - staticcheck
  exclusions:
    generated: lax # This setting controls how to handle linting errors for code identified as auto-generated by golangci-lint. Even if generated code violates certain linting rules, no errors will be reported and golangci-lint will not fail
    presets: # Predefined set of exclusion rules in golangci-lint
      - comments # Preset typically fixes linting issues related to code comments
      - common-false-positives # Aims to exclude known linting rules or specific issue patterns that are prone to false positives in certain common scenarios
      - legacy # This preset is typically used to handle issues that are common in older codebases but may not be ideal by modern standards, yet are difficult to fix on a large scale due to historical reasons
    rules:
      - path: _test\.go # Only applies to files ending with `_test.go`
        linters:
          - gosec # gosec linter
          - goconst # repeated literals are normal in table-driven tests
    paths:
      - internal/generated  # Exclude internal/generated directory
      - internal/internal   # Exclude internal/internal directory
      - internal/model      # Exclude internal/model directory
  settings:
    staticcheck: # Configuration for gosimple linter
      checks:
        - all # Enabled checks
        - -S1039
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    dogsled: # Configuration for dogsled linter
      max-blank-identifiers: 3 # Maximum number of consecutive blank identifiers allowed is 3
    misspell: # Configuration for misspell linter
      locale: US # Use US English locale settings for spell checking


formatters:
  # Enable specific formatter.
  # Default: [] (uses standard Go formatting)
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci: # Configuration for gci formatter
      # Section configuration to compare against.
      # Section names are case-insensitive and may contain parameters in ().
      # Default: ["standard", "default"]
      sections: # Define the order of import sections
        - standard # Captures all standard packages if they do not match another section
        - default # Contains all imports that could not be matched to another section type
        - localmodule # Packages of this module
      # Separators that should be present between sections.
      # Default: ["newLine"]
      custom-order: true # Enable custom sorting order

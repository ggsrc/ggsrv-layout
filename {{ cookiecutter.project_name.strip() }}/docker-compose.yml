# Docker Compose Configuration for {{ cookiecutter.project_name.strip() }}
#
# This file defines all the services required for local development:
# - PostgreSQL: Main database for application data
# - Redis: Caching layer
#
# Quick Start:
#   make docker-up      # Start all services
#   make docker-down    # Stop all services
#
# PostgreSQL: localhost:5432 (user: postgres, password: my-secret, db: {{ cookiecutter.project_name.strip() }}_test_db)
# Redis: localhost:6379

services:
  # PostgreSQL Database
  postgres:
    # Keep in step with internal/svc/svc_test.go and the production database.
    image: postgres:18.6
    container_name: {{ cookiecutter.project_name.strip() }}-postgres
    environment:
      POSTGRES_PASSWORD: my-secret
      POSTGRES_DB: {{ cookiecutter.project_name.strip() }}_test_db
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/.
      # A volume created by an older major cannot be opened: recreate it with
      # `docker compose down -v` (local data is lost) or dump and restore.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - {{ cookiecutter.project_name.strip() }}-network

  # Redis Cache
  redis:
    image: redis:8.10.3-alpine
    container_name: {{ cookiecutter.project_name.strip() }}-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - {{ cookiecutter.project_name.strip() }}-network

volumes:
  postgres_data:
  redis_data:

networks:
  {{ cookiecutter.project_name.strip() }}-network:
    driver: bridge
